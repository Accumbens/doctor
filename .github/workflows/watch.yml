name: zzzs-watch

on:
  schedule:
    # Targets: 22:07, 03:07 and 13:07 UTC ~= midnight, 05:00 and 15:00 Ljubljana
    # in summer (23:00/04:00/14:00 winter). ZZZS republishes overnight on
    # business days (confirmed: still Friday's file Saturday evening, so
    # weekends are dead) — the midnight run is an early catch in case that
    # happens before 5am.
    #
    # GitHub's `schedule` trigger is best-effort and has been observed to
    # silently drop a firing entirely, not just delay it (2026-09-12 22:00 run,
    # and the 2026-09-13 03:07 run, both never happened at all). So each target
    # gets 4 retries at +15/+30/+45/+60 min. should_run.py makes retries a
    # no-op once one attempt for the slot has already succeeded, so this still
    # sends at most one email per slot — see that file for details.
    - cron: "7,22,37,52 22,3,13 * * *"   # target, +15, +30, +45
    - cron: "7 23,4,14 * * *"           # +60
  workflow_dispatch:        # manual "Run workflow" button in the Actions tab — always runs for real

permissions:
  contents: write           # commit state.json back
  issues: write             # open the alert issue

concurrency:
  group: zzzs-watch         # two overlapping runs would race on state.json
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Has this slot already succeeded?
        id: slot
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: echo "should_run=$(python should_run.py)" >> "$GITHUB_OUTPUT"

      - if: steps.slot.outputs.should_run == 'run'
        run: pip install -r requirements.txt

      - name: Check who's accepting
        if: steps.slot.outputs.should_run == 'run'
        env:
          # No SMTP needed: the result (current list, nobody accepting, or an
          # error) is always written to alert.txt, and the next step always
          # turns that into a GitHub issue, which GitHub emails to you.
          ALERT_FILE: alert.txt
          IGNORE_URL: ${{ secrets.IGNORE_URL }}
          CITIES: LJUBLJANA
          # Optional extras — the job works fine with these secrets unset.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python watch.py

      - name: Open today's issue (current list, none accepting, or an error)
        # always(): watch.py exits non-zero on a genuine problem, but it still
        # writes alert.txt describing it first — that case must still email.
        if: always() && hashFiles('alert.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # provided automatically
        run: |
          title=$(head -1 alert.txt)
          tail -n +2 alert.txt > body.md
          gh issue create --title "$title" --body-file body.md

      - name: Persist state
        # Runs even if the step above failed, so a partial state still saves.
        if: always()
        run: |
          if [[ -z "$(git status --porcelain state.json)" ]]; then
            echo "No state change."
            exit 0
          fi
          git config user.name  "zzzs-watch"
          git config user.email "actions@github.com"
          git add state.json
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
          # A manual run may have pushed while this one worked.
          git pull --rebase --autostash || true
          git push
